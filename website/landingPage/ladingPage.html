
<head>
    <title>MONY - Discord Bot</title>
    <link rel="stylesheet" href="none.css">
</head>

<body>
    <main class="container">
        <h1 class="title">MONY <span>Discord Bot</span></h1>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon">🌐</div>
                <h2>Servers</h2>
                <p id="used_by_servers">No data fetched...</p>
            </div>

            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <h2>Users</h2>
                <p id="used_by_users">No data fetched...</p>
            </div>
        </div>

        <div id="guilds"></div>

        <p id="loginState"></p>
        <div id="profile"></div>

        <div class="actions">
            <a class="btn primary" href="http://127.0.0.1:8000/auth/login">Login</a>

            <button class="btn" onclick="logout()">Logout</button>

            <button class="btn" onclick="loadProfile()">Refresh</button>
        </div>
    </main>

    <footer>
        Made with 💜 by
        <a href="https://github.com/monytry">MONY</a>
    </footer>

    <script src="landingPage.js" defer></script>
</body>
